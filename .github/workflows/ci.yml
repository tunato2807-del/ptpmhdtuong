name: Django validation
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    env:
      POSTGRES_DB: gentleman
      POSTGRES_USER: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c 'CREATE DATABASE gentleman;'
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'ci-local-only';"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check and test
        env:
          POSTGRES_PASSWORD: ci-local-only
        run: python scripts/dev.py check
