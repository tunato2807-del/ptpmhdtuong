services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gentleman}
      POSTGRES_USER: ${POSTGRES_USER:-gentleman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.local/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-gentleman}
      POSTGRES_USER: ${POSTGRES_USER:-gentleman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
